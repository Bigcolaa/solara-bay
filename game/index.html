<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Solara Bay — Coastal Open World</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0a1024; }
  body { font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif; user-select:none; -webkit-user-select:none; }
  #stage { position:fixed; inset:0; }
  #gl, #hud { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hud { pointer-events:none; }
  #boot { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
    gap:14px; color:#ffe6b5; background:radial-gradient(circle at 50% 45%,#17365a,#080d1c 70%); z-index:9; }
  #boot b { font-size:26px; letter-spacing:.34em; font-weight:600; text-shadow:0 0 26px #ff9b4a88; }
  #boot span { font-size:11px; letter-spacing:.24em; color:#8fd8ff; }
  #boot.hidden { display:none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
  <div id="boot"><b>SOLARA BAY</b><span>BUILDING THE COAST…</span></div>
</div>
<script src="./src/core/maths.js"></script>
